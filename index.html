<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ethann — Stylus Themes</title>
    <meta
        name="description"
        content="Collection de thèmes Stylus créés par Ethann."
    >

    <style>
        :root {
            --bg: #0d0e10;
            --bg-2: #121316;
            --card: #17181c;
            --card-hover: #1c1e23;

            --border: #27292f;
            --border-hover: #3b3e47;

            --text: #f2f3f5;
            --text-2: #b5bac1;
            --text-3: #7d828c;

            --accent: #5865f2;
            --accent-hover: #6875f5;

            --green: #23a55a;

            --radius: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% -20%,
                    rgba(88, 101, 242, 0.13),
                    transparent 35%
                ),
                var(--bg);

            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =========================
           HEADER
           ========================= */

        header {
            position: sticky;
            top: 0;
            z-index: 100;

            background: rgba(13, 14, 16, 0.82);
            backdrop-filter: blur(18px);

            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .nav {
            max-width: 1150px;
            height: 70px;

            margin: auto;
            padding: 0 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            font-weight: 700;
            font-size: 18px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;

            display: grid;
            place-items: center;

            background: var(--accent);
            border-radius: 10px;

            font-size: 18px;
            font-weight: 800;
        }

        .github {
            color: var(--text-2);
            font-size: 14px;

            transition: 0.2s;
        }

        .github:hover {
            color: white;
        }


        /* =========================
           HERO
           ========================= */

        .hero {
            max-width: 900px;

            margin: auto;
            padding: 110px 24px 80px;

            text-align: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-bottom: 22px;
            padding: 7px 12px;

            border: 1px solid var(--border);
            border-radius: 999px;

            background: rgba(255, 255, 255, 0.025);

            color: var(--text-2);
            font-size: 13px;
        }

        .badge-dot {
            width: 7px;
            height: 7px;

            background: var(--green);
            border-radius: 50%;

            box-shadow: 0 0 10px rgba(35, 165, 90, 0.6);
        }

        h1 {
            margin-bottom: 20px;

            font-size: clamp(42px, 7vw, 72px);
            line-height: 1;
            letter-spacing: -3px;
        }

        .gradient {
            background: linear-gradient(
                90deg,
                #ffffff,
                #aeb4ff
            );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .hero p {
            max-width: 650px;
            margin: auto;

            color: var(--text-2);

            font-size: 17px;
            line-height: 1.7;
        }


        /* =========================
           MAIN
           ========================= */

        main {
            max-width: 1150px;

            margin: auto;
            padding: 0 24px 100px;
        }


        /* =========================
           TOOLBAR
           ========================= */

        .toolbar {
            margin-bottom: 28px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .toolbar-title h2 {
            margin-bottom: 5px;
            font-size: 22px;
        }

        .toolbar-title p {
            color: var(--text-3);
            font-size: 14px;
        }

        .search {
            width: 280px;

            padding: 12px 15px;

            background: var(--bg-2);

            border: 1px solid var(--border);
            border-radius: 10px;

            color: white;

            outline: none;

            transition: 0.2s;
        }

        .search::placeholder {
            color: var(--text-3);
        }

        .search:focus {
            border-color: var(--accent);

            box-shadow:
                0 0 0 3px rgba(88, 101, 242, 0.12);
        }


        /* =========================
           THEMES
           ========================= */

        .themes {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(320px, 1fr));

            gap: 18px;
        }

        .theme {
            position: relative;

            display: flex;
            flex-direction: column;

            min-height: 300px;
            padding: 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.025),
                    transparent
                ),
                var(--card);

            border: 1px solid var(--border);
            border-radius: var(--radius);

            scroll-margin-top: 110px;

            transition:
                transform 0.2s,
                border-color 0.2s,
                background 0.2s,
                box-shadow 0.2s;
        }

        .theme:hover {
            transform: translateY(-3px);

            border-color: var(--border-hover);

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.04),
                    transparent
                ),
                var(--card-hover);
        }


        /* Thème ouvert via #discordstatus etc. */

        .theme:target {
            transform: translateY(-3px);

            border-color: var(--accent);

            box-shadow:
                0 0 0 1px rgba(88, 101, 242, 0.35),
                0 0 35px rgba(88, 101, 242, 0.15);
        }


        /* =========================
           CARD
           ========================= */

        .theme-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            gap: 15px;

            margin-bottom: 20px;
        }

        .theme-icon {
            width: 52px;
            height: 52px;

            display: grid;
            place-items: center;

            border-radius: 13px;

            background: #22242a;
            border: 1px solid #303239;

            font-size: 23px;
            font-weight: 700;
        }

        .version {
            padding: 6px 9px;

            background: rgba(88, 101, 242, 0.12);

            color: #aeb4ff;

            border: 1px solid rgba(88, 101, 242, 0.22);
            border-radius: 7px;

            font-size: 12px;
            font-family: monospace;
        }

        .theme h3 {
            margin-bottom: 8px;
            font-size: 19px;
        }

        .description {
            margin-bottom: 20px;

            color: var(--text-2);

            font-size: 14px;
            line-height: 1.6;
        }

        .info {
            margin-top: auto;
            margin-bottom: 18px;

            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            padding: 5px 8px;

            background: #202126;

            border: 1px solid #2d2f35;
            border-radius: 6px;

            color: var(--text-2);

            font-size: 11px;
        }

        .date {
            width: 100%;
            margin-top: 5px;

            color: var(--text-3);
            font-size: 12px;
        }


        /* =========================
           BUTTONS
           ========================= */

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
        }

        .button {
            min-height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 10px 12px;

            border-radius: 8px;

            font-size: 13px;
            font-weight: 600;

            transition: 0.2s;
        }

        .install {
            background: var(--accent);
            color: white;
        }

        .install:hover {
            background: var(--accent-hover);
        }

        .source {
            background: #24262b;

            border: 1px solid #303239;

            color: var(--text-2);
        }

        .source:hover {
            background: #2c2e34;
            color: white;
        }


        /* =========================
           EMPTY
           ========================= */

        .empty {
            display: none;

            padding: 60px 20px;

            border: 1px dashed var(--border);
            border-radius: var(--radius);

            text-align: center;

            color: var(--text-3);
        }


        /* =========================
           FOOTER
           ========================= */

        footer {
            padding: 35px 20px;

            border-top: 1px solid var(--border);

            color: var(--text-3);

            text-align: center;
            font-size: 13px;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 650px) {

            .nav {
                padding: 0 17px;
            }

            .hero {
                padding: 80px 18px 60px;
            }

            h1 {
                letter-spacing: -2px;
            }

            main {
                padding: 0 17px 70px;
            }

            .toolbar {
                align-items: stretch;
                flex-direction: column;
            }

            .search {
                width: 100%;
            }

            .themes {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>


<header>

    <div class="nav">

        <a
            href="https://11ethann11.github.io/stylus/"
            class="brand"
        >
            <div class="brand-icon">
                S
            </div>

            <span>
                Stylus Themes
            </span>
        </a>


        <a
            class="github"
            href="https://github.com/11ethann11/stylus"
            target="_blank"
            rel="noopener"
        >
            GitHub ↗
        </a>

    </div>

</header>


<section class="hero">

    <div class="badge">

        <span class="badge-dot"></span>

        UserStyles pour Stylus

    </div>


    <h1>
        Mes
        <span class="gradient">
            Stylus Themes
        </span>
    </h1>


    <p>
        Une collection de thèmes et modifications CSS
        pour personnaliser différents sites.
        Installation simple avec Stylus.
    </p>

</section>


<main>

    <div class="toolbar">

        <div class="toolbar-title">

            <h2>
                Thèmes
            </h2>

            <p>
                <span id="theme-count">0</span>
                thème(s) disponible(s)
            </p>

        </div>


        <input
            id="search"
            class="search"
            type="search"
            placeholder="Rechercher un thème..."
        >

    </div>


    <!--
        Les thèmes seront automatiquement
        générés ici par JavaScript.
    -->

    <div
        class="themes"
        id="themes"
    ></div>


    <div
        class="empty"
        id="empty"
    >
        Aucun thème trouvé.
    </div>

</main>


<footer>
    Créé par Ethann · UserStyles pour Stylus
</footer>


<script>

    /* =========================================================
       =========================================================

                     AJOUTE TES THEMES ICI

       =========================================================
       ========================================================= */


    const themesData = [

        {

            /*
                ID UNIQUE DU THEME

                Cet ID donne également l'URL :

                #discordstatus

                donc :

                https://11ethann11.github.io/stylus/#discordstatus
            */

            id: "discordstatus",


            /*
                Nom affiché
            */

            name: "Discord Status — Dark",


            /*
                Lettre / petit logo affiché
            */

            icon: "D",


            /*
                Version du thème
            */

            version: "1.0.0",


            /*
                Description
            */

            description:
                "Transforme Discord Status en véritable interface sombre inspirée de Discord. Inclut les composants, incidents, graphiques et menus.",


            /*
                Tags
            */

            tags: [
                "discordstatus.com",
                "Dark",
                "Stylus"
            ],


            /*
                Date affichée
            */

            updated:
                "15 septembre 2026",


            /*
                Lien RAW du fichier .user.css
            */

            install:
                "https://raw.githubusercontent.com/11ethann11/stylus/main/themes/discord-status-dark.user.css",


            /*
                Lien vers le code GitHub
            */

            source:
                "https://github.com/11ethann11/stylus/blob/main/themes/discord-status-dark.user.css"

        }


        /*
            AJOUTE LES AUTRES THEMES
            EN DESSOUS.

            IMPORTANT :

            Il faut mettre une VIRGULE après
            le thème précédent.

            Exemple :

            },

            {
                id: "youtube",
                ...
            }

        */

    ];



    /* =========================================================
       NE MODIFIE PAS OBLIGATOIREMENT CE QUI SUIT
       ========================================================= */


    const themesContainer =
        document.getElementById("themes");


    const search =
        document.getElementById("search");


    const count =
        document.getElementById("theme-count");


    const empty =
        document.getElementById("empty");



    /* =========================================================
       GÉNÉRATION DES CARTES
       ========================================================= */


    function createThemes() {

        themesContainer.innerHTML = "";


        themesData.forEach(theme => {


            const article =
                document.createElement("article");


            article.className = "theme";

            article.id = theme.id;


            article.dataset.search = [

                theme.id,

                theme.name,

                theme.description,

                ...theme.tags

            ].join(" ").toLowerCase();



            const tagsHTML =
                theme.tags
                    .map(tag => {

                        return `
                            <span class="tag">
                                ${tag}
                            </span>
                        `;

                    })
                    .join("");



            article.innerHTML = `

                <div class="theme-top">

                    <div class="theme-icon">
                        ${theme.icon}
                    </div>

                    <span class="version">
                        v${theme.version}
                    </span>

                </div>


                <h3>
                    ${theme.name}
                </h3>


                <p class="description">
                    ${theme.description}
                </p>


                <div class="info">

                    ${tagsHTML}

                    <div class="date">
                        Mis à jour le ${theme.updated}
                    </div>

                </div>


                <div class="actions">

                    <a
                        class="button install"
                        href="${theme.install}"
                        target="_blank"
                        rel="noopener"
                    >
                        Installer
                    </a>


                    <a
                        class="button source"
                        href="${theme.source}"
                        target="_blank"
                        rel="noopener"
                    >
                        Code source
                    </a>

                </div>

            `;


            themesContainer.appendChild(article);

        });


        count.textContent =
            themesData.length;

    }



    createThemes();



    /* =========================================================
       RECHERCHE
       ========================================================= */


    search.addEventListener("input", () => {

        const query =
            search.value
                .toLowerCase()
                .trim();


        const cards =
            document.querySelectorAll(".theme");


        let visible = 0;


        cards.forEach(card => {

            const match =
                card.dataset.search.includes(query);


            card.style.display =
                match
                    ? "flex"
                    : "none";


            if (match) {
                visible++;
            }

        });


        empty.style.display =
            visible === 0
                ? "block"
                : "none";

    });



    /* =========================================================
       OUVERTURE DIRECTE VIA #ID
       ========================================================= */


    function openThemeFromURL() {

        const hash =
            window.location.hash;


        if (!hash) {
            return;
        }


        const id =
            hash.substring(1);


        const theme =
            document.getElementById(id);


        if (!theme) {
            return;
        }


        /*
            Si une recherche était active,
            on la supprime.
        */

        search.value = "";


        document
            .querySelectorAll(".theme")
            .forEach(card => {

                card.style.display = "flex";

            });


        empty.style.display = "none";


        /*
            Scroll vers le thème
        */

        setTimeout(() => {

            theme.scrollIntoView({

                behavior: "smooth",
                block: "center"

            });

        }, 200);

    }



    openThemeFromURL();


    window.addEventListener(
        "hashchange",
        openThemeFromURL
    );

</script>


</body>
</html>
